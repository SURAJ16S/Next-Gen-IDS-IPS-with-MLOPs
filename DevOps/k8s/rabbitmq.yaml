apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-rabbitmq
  namespace: devops-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devops-rabbitmq
  template:
    metadata:
      labels:
        app: devops-rabbitmq
    spec:
      containers:
      - name: rabbitmq
        image: rabbitmq:3-management
        ports:
        - containerPort: 5672
          name: amqp
        - containerPort: 15672
          name: management
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 400m
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: devops-rabbitmq-service
  namespace: devops-system
spec:
  selector:
    app: devops-rabbitmq
  ports:
  - name: amqp
    protocol: TCP
    port: 5672
    targetPort: 5672
  - name: management
    protocol: TCP
    port: 15672
    targetPort: 15672
