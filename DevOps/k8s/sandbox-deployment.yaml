apiVersion: v1
kind: Namespace
metadata:
  name: ephemeral-sandbox
  labels:
    security: isolated-sandbox
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: untrusted-app-sandbox
  namespace: ephemeral-sandbox
  labels:
    app: untrusted-app
    tier: sandbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: untrusted-app
  template:
    metadata:
      labels:
        app: untrusted-app
    spec:
      runtimeClassName: gvisor # CRITICAL: Enforces user-space syscall interception via runsc
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: app-container
        image: local-devops-build:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: untrusted-app-service
  namespace: ephemeral-sandbox
spec:
  selector:
    app: untrusted-app
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
  type: ClusterIP
