apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-registry
  namespace: devops-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devops-registry
  template:
    metadata:
      labels:
        app: devops-registry
    spec:
      containers:
      - name: registry
        image: registry:2
        ports:
        - containerPort: 5000
          name: registry
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: devops-registry-service
  namespace: devops-system
spec:
  selector:
    app: devops-registry
  ports:
  - protocol: TCP
    port: 5000
    targetPort: 5000
